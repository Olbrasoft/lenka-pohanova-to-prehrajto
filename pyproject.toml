[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lenka-pohanova-to-prehrajto"
version = "0.1.0"
description = "Independent Czech and English series variants for the Lenka account"
requires-python = ">=3.12"
dependencies = [
  "sdilej-serialy @ git+https://github.com/Olbrasoft/sdilej-serialy.git@a83ddf96d486711cd6477c34ef04ced791ab344a",
]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.11", "PyYAML>=6"]
discovery = ["faster-whisper==1.2.1", "av>=18.1,<19", "lingua-language-detector==2.2.0"]

[project.scripts]
lenka-sync = "lenka_sync.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
