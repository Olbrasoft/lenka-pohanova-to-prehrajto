name: diagnose-upload-connectivity
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install .
      - name: Measure the original source without allocating a target video
        env:
          SDILEJ_EMAIL: ${{ secrets.SDILEJ_EMAIL }}
          SDILEJ_PASSWORD: ${{ secrets.SDILEJ_PASSWORD }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from pathlib import Path
          from sdilej_serialy.episodes import EpisodeSourceProvider
          from sdilej_serialy.resilience import error_evidence
          from sdilej_serialy.source_transfer import FreshSourceSession
          from sdilej_to_prehrajto.models import Candidate
          from lenka_sync.transfer import prepare_source

          identity = "7382:1:2"
          rows = Path("variants/cz/manifests/selected-episodes.jsonl").read_text().splitlines()
          row = next(json.loads(line) for line in rows if json.loads(line)["identity"] == identity)
          candidate = Candidate.from_dict(row["selected"])
          provider = None
          try:
              provider = EpisodeSourceProvider.authenticated(os.environ["SDILEJ_EMAIL"], os.environ["SDILEJ_PASSWORD"])
              refreshed = prepare_source(provider, candidate, True)
              source = FreshSourceSession(provider, candidate, require_original_size=True)
              response = source.get(refreshed.download_url, headers={
                  "Accept-Encoding": "identity", "Range": "bytes=0-", "Referer": candidate.url,
              }, stream=True, timeout=(15, 30))
              started, received = time.monotonic(), 0
              try:
                  while received < 4 * 1024 * 1024 and time.monotonic() - started < 90:
                      block = response.raw.read(min(65536, 4 * 1024 * 1024 - received))
                      if not block:
                          break
                      received += len(block)
                  elapsed = time.monotonic() - started
                  print(json.dumps({"source_id": candidate.source_id, "sample_bytes": received,
                                    "elapsed_seconds": round(elapsed, 3),
                                    "mib_per_second": round(received / max(elapsed, 0.001) / 1024 / 1024, 3)}), flush=True)
              finally:
                  response.close()
          except Exception as error:
              print(json.dumps({"source_probe_failed": error_evidence(error)}), flush=True)
              raise SystemExit(1) from None
          finally:
              if provider is not None:
                  provider.session.close()
          PY
      - name: Probe upload gateway without allocating or transferring a video
        run: |
          python - <<'PY'
          import json
          import socket
          import time
          from urllib.parse import urlsplit
          import requests
          from sdilej_serialy.resilience import error_evidence
          from sdilej_to_prehrajto import prehrajto
          from lenka_sync.transfer import UPLOAD_URL

          host = urlsplit(prehrajto.UPLOAD_URL).hostname
          addresses = socket.getaddrinfo(host, 443, type=socket.SOCK_STREAM)
          print(json.dumps({"dns_families": sorted({int(a[0]) for a in addresses})}), flush=True)
          for gateway, method in ((g, m) for g in (prehrajto.UPLOAD_URL, UPLOAD_URL) for m in ("GET", "POST")):
              started = time.monotonic()
              try:
                  response = requests.request(method, gateway, data=b"", timeout=(10, 10))
                  print(json.dumps({"gateway": urlsplit(gateway).hostname, "method": method, "status": response.status_code,
                                    "elapsed": round(time.monotonic() - started, 2)}), flush=True)
                  response.close()
              except Exception as error:
                  chain, seen = [], set()
                  while error is not None and id(error) not in seen:
                      seen.add(id(error))
                      chain.append(error_evidence(error))
                      error = error.__cause__ or error.__context__
                  print(json.dumps({"gateway": urlsplit(gateway).hostname, "method": method, "errors": chain,
                                    "elapsed": round(time.monotonic() - started, 2)}), flush=True)
          PY
